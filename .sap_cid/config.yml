general:
  buildTool: mta
  productiveBranch: main

stages:
  build:
    detectSecrets: true
    npmAudit: true
  release:
    tmsUpload: true

steps:
  detectSecrets:
    scanParameters: "--all-files"

  npmAudit:
    auditedAdvisories:
      - moderate
      - high
      - critical
    npmAuditParameters: "--omit=dev"

  tmsUpload:
    nodeName: DEV
    mtaPath: mta_archives
    credentialsId: tms-service-key
