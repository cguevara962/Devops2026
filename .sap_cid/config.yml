general:
  productiveBranch: main

stages:
  build:
    buildTool: mta
    buildToolVersion: "Java 21 Node 20"
    detectSecrets: true
    npmAudit: true
  release: {}

steps:
  detectSecrets:
    scanParameters: "--all-files"

  npmAudit:
    auditedAdvisories:
      - moderate
      - high
      - critical
    npmAuditParameters: "--omit=dev"

  tmsUpload:
    nodeName: DEV
    mtaPath: mta_archives
    credentialsId: tms-service-key
