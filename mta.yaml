_schema-version: "3.1"
ID: btp-devsecops-demo
description: DevSecOps Demo CAP App — AD107102 Workshop
version: 0.0.1

# ─── Build parameters ─────────────────────────────────────────────────────────
# mbt build runs these before packaging any module.
# cds build --production compiles .cds files to gen/srv (nodejs-ready) and gen/db (sql).
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

# ─── Modules ─────────────────────────────────────────────────────────────────
modules:

  - name: btp-devsecops-demo-srv
    type: nodejs
    path: gen/srv                   # generated by cds build --production
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
      health-check-type: port       # CAP doesn't expose /health by default
    build-parameters:
      builder: npm
      build-result: .
    provides:
      - name: btp-devsecops-demo-srv_api
        properties:
          url: ${default-url}
    requires:
      - name: devsecops-demo-xsuaa
      - name: devsecops-demo-credential-store

# ─── Resources (BTP services) ────────────────────────────────────────────────
resources:

  - name: devsecops-demo-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json

  # Credential Store (user-provided service — simulates managed credstore binding).
  # Created via: cf cups devsecops-demo-credential-store -p '{"db-password":"...","namespace":"pipeline-demo"}'
  - name: devsecops-demo-credential-store
    type: org.cloudfoundry.existing-service
